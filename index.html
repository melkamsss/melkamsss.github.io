<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Golden Stainless Steel Charcoal Stove</title>

  <style>
    body {
      margin: 0;
      padding: 30px 15px;
      background: #f3f3f3;
      font-family: Arial, Helvetica, sans-serif;
    }

    .product-card {
      max-width: 450px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 5px 20px rgba(0,0,0,0.12);
    }

    .product-image {
      width: 100%;
      max-height: 350px;
      object-fit: contain;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 25px;
      margin: 10px 0 8px;
      color: #222;
    }

    .product-id {
      font-size: 14px;
      color: #777;
      margin-bottom: 25px;
    }

    .barcode-title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .barcode {
      width: 220px;
      height: 220px;
      object-fit: contain;
      margin: auto;
    }

    .instruction {
      font-size: 14px;
      color: #555;
      margin: 10px 0 20px;
    }

    .view-button {
      display: inline-block;
      padding: 12px 25px;
      background: #222;
      color: white;
      text-decoration: none;
      border-radius: 7px;
      font-weight: bold;
    }

    .view-button:hover {
      opacity: 0.85;
    }

    .footer {
      margin-top: 25px;
      font-size: 12px;
      color: #888;
    }
  </style>
</head>

<body>

  <div class="product-card">

    <!-- PRODUCT IMAGE -->
    <img
      class="product-image"
      src="Golden Stainless steel charcoal stove.jpg"
      alt="Golden Stainless steel charcoal stove"
    >

    <!-- PRODUCT NAME -->
    <h1>
      Golden Stainless steel charcoal stove
    </h1>

    <!-- PRODUCT ID -->
    <div class="product-id">
      Product ID: GSSCS-001
    </div>

    <!-- DATA MATRIX -->
    <div class="barcode-title">
      Scan to view this product
    </div>

    <img
      class="barcode"
      src="https://barcode.tec-it.com/barcode.ashx?data=https%3A%2F%2Fmelkamsss.github.io%2F&code=DataMatrix&dmsize=Default"
      alt="Data Matrix"
    >

    <div class="instruction">
      Scan the 2D code with your phone camera.
    </div>

    <!-- BUTTON -->
    <a
      class="view-button"
      href="https://melkamsss.github.io/"
      target="_blank"
    >
      View Product
    </a>

    <div class="footer">
      Golden Stainless steel charcoal stove
    </div>

  </div>

</body>
</html>
