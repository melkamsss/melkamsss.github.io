<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Golden Stainless Steel Charcoal Stove</title>

  <!-- JsBarcode library for generating a traditional 1D Code 128 barcode -->

  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

  <style>
    body {
      margin: 0;
      padding: 30px 15px;
      background: #f3f3f3;
      font-family: Arial, Helvetica, sans-serif;
    }

    .product-card {
      max-width: 450px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.12);
    }

    .product-image {
      width: 100%;
      max-height: 350px;
      object-fit: contain;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 25px;
      margin: 10px 0 8px;
      color: #222;
    }

    .product-id {
      font-size: 14px;
      color: #777;
      margin-bottom: 25px;
    }

    .barcode-title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 10px;
      color: #222;
    }

    /* Barcode container */
    .barcode-container {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 10px 0 0;
    }

    /* Traditional 1D Code 128 barcode */
    #barcode {
      width: 320px;
      height: 100px;
      max-width: 100%;
    }

    /* Product name underneath barcode */
    .barcode-product-name {
      font-size: 15px;
      font-weight: bold;
      color: #222;
      margin-top: 8px;
      margin-bottom: 15px;
    }

    .instruction {
      font-size: 14px;
      color: #555;
      margin: 10px 0 20px;
    }

    .view-button {
      display: inline-block;
      padding: 12px 25px;
      background: #222;
      color: white;
      text-decoration: none;
      border-radius: 7px;
      font-weight: bold;
    }

    .view-button:hover {
      opacity: 0.85;
    }

    .footer {
      margin-top: 25px;
      font-size: 12px;
      color: #888;
    }
  </style>

</head>

<body>

  <div class="product-card">

```
<!-- PRODUCT IMAGE -->
<img
  class="product-image"
  src="Golden Stainless steel charcoal stove.jpg"
  alt="Golden Stainless steel charcoal stove"
>

<!-- PRODUCT NAME -->
<h1>
  Golden Stainless steel charcoal stove
</h1>

<!-- PRODUCT ID -->
<div class="product-id">
  Product ID: GSSCS-001
</div>

<!-- BARCODE TITLE -->
<div class="barcode-title">
  Scan to view this product
</div>

<!-- TRADITIONAL 1D CODE 128 BARCODE -->
<div class="barcode-container">
  <svg id="barcode"></svg>
</div>

<!-- PRODUCT NAME UNDER BARCODE -->
<div class="barcode-product-name">
  Golden Stainless steel charcoal stove
</div>

<!-- INSTRUCTION -->
<div class="instruction">
  Scan the 1D barcode with a compatible barcode scanner.
</div>

<!-- BUTTON -->
<a
  class="view-button"
  href="https://melkamsss.github.io/"
  target="_blank"
  rel="noopener noreferrer"
>
  View Product
</a>

<!-- FOOTER -->
<div class="footer">
  Golden Stainless steel charcoal stove
</div>
```

  </div>

  <script>
    // URL stored inside the barcode
    const productURL = "https://melkamsss.github.io/";

    // Generate traditional 1D Code 128 barcode
    // displayValue: false removes the URL/text underneath the barcode
    JsBarcode("#barcode", productURL, {
      format: "CODE128",
      width: 2,
      height: 90,
      displayValue: false,
      margin: 10,
      background: "#ffffff",
      lineColor: "#000000"
    });
  </script>

</body>
</html>
