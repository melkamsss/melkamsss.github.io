```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GSSCS-001 Barcode</title>

  <!-- Code 128 Barcode Library -->
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .barcode-container {
      text-align: center;
    }

    #barcode {
      width: 320px;
      height: auto;
    }
  </style>
</head>

<body>

  <div class="barcode-container">

    <!-- Code 128 Barcode -->
    <svg id="barcode"></svg>

  </div>

  <script>
    JsBarcode("#barcode", "GSSCS-001", {
      format: "CODE128",
      width: 2,
      height: 100,
      displayValue: true,
      text: "GSSCS-001",
      fontSize: 18,
      textMargin: 8,
      margin: 10,
      background: "#ffffff",
      lineColor: "#000000"
    });
  </script>

</body>
</html>
