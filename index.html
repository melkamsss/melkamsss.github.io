```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Barcode - GSSCS-001</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>

    <style>
        body {
            margin: 0;
            padding: 30px 10px;
            background: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .barcode-container {
            width: 100%;
            max-width: 700px;
            margin: 30px auto;
        }

        #barcode {
            display: block;
            width: 100%;
            height: auto;
        }

        .sku {
            margin-top: 15px;
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 2px;
            color: #000000;
        }

        .note {
            font-size: 13px;
            color: #555555;
        }

        @media print {
            body {
                padding: 10px;
            }

            .barcode-container {
                max-width: 650px;
            }

            .note {
                display: none;
            }
        }
    </style>
</head>

<body>

    <main class="barcode-container">
        <svg id="barcode"></svg>

        <div class="sku">GSSCS-001</div>

        <p class="note">Code 128 Product Barcode</p>
    </main>

    <script>
        const productURL =
            "https://melkamsss.github.io/product.html";

        JsBarcode("#barcode", productURL, {
            format: "CODE128",
            width: 2,
            height: 100,
            displayValue: false,
            margin: 15,
            background: "#ffffff",
            lineColor: "#000000"
        });
    </script>

</body>
</html>
