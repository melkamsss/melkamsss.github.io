
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GSSCS-001</title>

  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

  <style>
    body {
      margin: 0;
      padding: 30px 10px;
      background: #ffffff;
      text-align: center;
      font-family: Arial, sans-serif;
    }

    .barcode-container {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
    }

    #barcode {
      display: block;
      width: 100%;
      height: auto;
    }

    .sku {
      margin-top: 12px;
      font-size: 22px;
      font-weight: bold;
      color: #000000;
      letter-spacing: 2px;
    }

    @media print {
      body {
        padding: 10px;
      }

      .barcode-container {
        max-width: 400px;
      }
    }
  </style>
</head>

<body>

  <div class="barcode-container">
    <svg id="barcode" role="img"
         aria-label="Code 128 barcode for SKU GSSCS-001"></svg>

    <div class="sku">GSSCS-001</div>
  </div>

  <script>
    window.addEventListener("load", function () {
      if (typeof JsBarcode === "undefined") {
        document.body.innerHTML =
          "<p>Barcode library failed to load. Check your internet connection.</p>";
        return;
      }

      JsBarcode("#barcode", "GSSCS-001", {
        format: "CODE128",
        width: 2,
        height: 100,
        displayValue: false,
        margin: 20,
        background: "#ffffff",
        lineColor: "#000000"
      });
    });
  </script>

</body>
</html>
